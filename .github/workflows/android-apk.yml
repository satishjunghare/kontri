name: Android APK

on:
  push:
    branches: [main, master, 'ccr-*']
  workflow_dispatch:
    inputs:
      older_phones:
        description: 'Also build the APK for older 32-bit phones (Kontri-older-phones.apk)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      # Size settings (passed as Gradle properties, so the generated android/ folder is untouched):
      # - one CPU architecture per APK instead of all four
      # - shrink unused resources (code minify is already on)
      # - compress native libraries inside the APK (smaller download)
      - name: Build release APK (64-bit phones)
        working-directory: android
        run: >
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          -Pexpo.useLegacyPackaging=true
      - name: Save 64-bit APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Kontri.apk
      - name: Show APK size
        run: ls -lh Kontri.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kontri-apk
          path: Kontri.apk
      # 32-bit APKs now live in their own release; remove any old copy from this one.
      # Release tags keep the old "tripsplit-" names so existing links keep working.
      - name: Remove old APKs from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in Kontri-older-phones.apk TripSplit.apk TripSplit-older-phones.apk; do
            gh release delete-asset tripsplit-latest "$f" --yes --repo "$GITHUB_REPOSITORY" || true
          done
      - name: Publish to "Kontri latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tripsplit-latest
          name: Kontri (latest build)
          prerelease: true
          make_latest: false
          files: Kontri.apk
          body: |
            Latest Android build of Kontri from `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Open this page on your Android phone, download **Kontri.apk**, and install it
            (allow "Install unknown apps" for your browser when asked).
            For 64-bit phones (almost all phones from the last several years). If it says
            "App not installed" or "not compatible", use the "Kontri for older phones" release.

      # Only when run manually with "older_phones" ticked (Actions -> Android APK -> Run workflow).
      - name: Build release APK (older 32-bit phones)
        if: ${{ inputs.older_phones }}
        working-directory: android
        run: >
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=armeabi-v7a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          -Pexpo.useLegacyPackaging=true
      - name: Save 32-bit APK
        if: ${{ inputs.older_phones }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Kontri-older-phones.apk
          ls -lh Kontri-older-phones.apk
      - name: Publish to "Kontri for older phones" release
        if: ${{ inputs.older_phones }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tripsplit-older-phones
          name: Kontri for older phones (32-bit)
          prerelease: true
          make_latest: false
          files: Kontri-older-phones.apk
          body: |
            Android build of Kontri for older phones running 32-bit Android,
            from `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Only use this if Kontri.apk from "Kontri (latest build)" will not install.
