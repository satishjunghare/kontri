name: Android APK

on:
  push:
    branches: [main, master, 'ccr-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      # Size settings (passed as Gradle properties, so the generated android/ folder is untouched):
      # - one CPU architecture per APK instead of all four
      # - shrink unused resources (code minify is already on)
      # - compress native libraries inside the APK (smaller download)
      - name: Build release APK (64-bit phones)
        working-directory: android
        run: >
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          -Pexpo.useLegacyPackaging=true
      - name: Save 64-bit APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TripSplit.apk
      - name: Build release APK (older 32-bit phones)
        working-directory: android
        run: >
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=armeabi-v7a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          -Pexpo.useLegacyPackaging=true
      - name: Save 32-bit APK and show sizes
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TripSplit-older-phones.apk
          ls -lh TripSplit*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TripSplit-apk
          path: TripSplit*.apk
      - name: Publish to "TripSplit latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tripsplit-latest
          name: TripSplit (latest build)
          prerelease: true
          make_latest: false
          files: |
            TripSplit.apk
            TripSplit-older-phones.apk
          body: |
            Latest Android build of TripSplit from `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Open this page on your Android phone, download **TripSplit.apk**, and install it
            (allow "Install unknown apps" for your browser when asked).
            If it says "App not installed" or "not compatible", your phone runs 32-bit Android:
            use **TripSplit-older-phones.apk** instead.
